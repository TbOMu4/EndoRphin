permissions:
  contents: read
  pages: write
  id-token: write  # ← обов'язково!

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build
        run: npm run build  # або твоя команда збірки

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./dist  # папка з білдом замість 'folder'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2